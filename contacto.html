<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/login.css">
    <script defer  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="js/app.js"></script>
</head>
<body>
    <header ><div class="hm-header">

            <div class="container">
                <div class="header-menu">

                    <div class="hm-logo">
                        <a href="index.html">
                            <img src="img/logo-home-master-store.png" alt="">
                        </a>
                    </div>

                    <nav class="hm-menu">
                        <ul>
                            <li><a href="#">Productos</a></li>   
                            <li><a href="blog.html">Blog</a></li>
                            <li><a href="nosotros.html">Nosotros</a></li>
                            <li><a href="contacto.html">Contacto</a></li>
                        </ul>


                        <div class="hm-icon-cart">
                            <a href="carrito.html">
                                <i class="las la-shopping-cart"></i>
                                <span id="contadorCarrito">0</span> 
                            </a>
                        </div>
                        

                        <div class="icon-menu">
                            <button type="button"><i class="fas fa-bars"></i></button>
                        </div>

                    </nav>

                </div>
            </div>

        </div>
        </nav>

    </header>

    <section class="container">
        <form id="formContacto" action="#" method="post" class="bg-dark p-4 my-4 rounded shadow-sm mx-auto">
            
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label text-info">Nombre completo</label>
                    <input type="text" required id="nombre" name="nombre" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="correo" class="form-label text-info">Correo electrónico</label>
                    <input type="email" required id="correo" name="correo" class="form-control">
                </div>

            </div>

            <div class="mb-3">
                <label for="asunto" class="text-info form-label">Asunto</label>
                <select class="form-select" id="asunto">
                    <option value="cotizacion">Cotización</option>
                    <option value="pedido">Pedido</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label text-info">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terminos" >
                <label class="text-info form-check-label" for="terminos">
                    Acepto ser contado por correo
                </label>

            </div>

            <button id="btnEnviar" type="submit" class="btn btn-primary btn-lg">Enviar Mensaje</button>


        </form>

    </section>
    
</body>

</html>
