<body>
    <header ><div class="hm-header">

            <div class="container">
                <div class="header-menu">

                    <div class="hm-logo">
                        <a href="index.html">

                        </a>
                    </div>

                    <nav class="hm-menu">
                        <ul>
                            <li><a href="../productos.html">Productos</a></li>

            </div>

        </div>
        </nav>

    </header>

    <section class="container">
        <form id="formContacto" action="#" method="post" class="bg-light p-4 my-4 rounded shadow-sm mx-auto">
            
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label text-secondary">Nombre completo</label>
                    <input type="text" required id="nombre" name="nombre" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="correo" class="form-label text-secondary">Correo electrónico</label>
                    <input type="email" required id="correo" name="correo" class="form-control">
                </div>

            </div>

            <div class="mb-3">
                <label for="asunto" class="text-secondary form-label">Asunto</label>
                <select class="form-select" id="asunto">
                    <option value="cotizacion">Cotización</option>
                    <option value="pedido">Pedido</option>
                    <option value="reclamo">Reclamo</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label text-secondary">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"></textarea>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terminos" >
                <label class="text-secondary form-check-label" for="terminos">
                    Acepto ser contado por correo
                </label>

            </div>

            <button id="btnEnviar" type="submit" class="btn btn-success btn-lg">Enviar Mensaje</button>


        </form>

    </section>
   <footer>

                            </div>
                        </form>

                    </div>
