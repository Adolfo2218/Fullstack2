    <script>
        // Función para cargar el carrito al abrir esta página y mostrar los productos con sus imágenes
        function cargarCarrito() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const listaCarrito = document.getElementById('listaCarrito');
            listaCarrito.innerHTML = '';

            if (carrito.length === 0) {
                listaCarrito.innerHTML = '<li>El carrito está vacío</li>';
            } else {
                carrito.forEach((producto, index) => {
                    const item = document.createElement('li');
                    item.innerHTML = `
                        <div class="producto-carrito">
                            <img src="${producto.imagen}" alt="${producto.nombre}" class="imagen-producto-carrito">
                            <div class="info-producto">
                                <h3>${producto.nombre}</h3>
                                <p>${producto.precio}</p>
                            </div>
                            <button onclick="eliminarDelCarrito(${index})" class="btn-eliminar">Eliminar</button>
                        </div>
                    `;
                    listaCarrito.appendChild(item);
                });
            }
        }

        // Función para eliminar un producto del carrito
        function eliminarDelCarrito(index) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.splice(index, 1); // Elimina el producto en la posición "index"
            localStorage.setItem('carrito', JSON.stringify(carrito)); // Actualiza el localStorage
            cargarCarrito(); // Recarga la lista del carrito para reflejar los cambios
        }

        // Cargar el carrito al abrir la página
        cargarCarrito();
    </script>

<script>
    // Función para cargar el carrito al abrir esta página y mostrar los productos con sus imágenes
    function cargarCarrito() {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const listaCarrito = document.getElementById('listaCarrito');
        const totalCarrito = document.getElementById('totalCarrito');
        listaCarrito.innerHTML = '';
        let total = 0;

        if (carrito.length === 0) {
            listaCarrito.innerHTML = '<li>El carrito está vacío</li>';
            totalCarrito.textContent = "Total: S/ 0.00";
        } else {
            carrito.forEach((producto, index) => {
                const item = document.createElement('li');
                item.innerHTML = `
                    <div class="producto-carrito">
                        <img src="${producto.imagen}" alt="${producto.nombre}" class="imagen-producto-carrito">
                        <div class="info-producto">
                            <h3>${producto.nombre}</h3>
                            <p>${producto.precio}</p>
                        </div>
                        <button onclick="eliminarDelCarrito(${index})" class="btn-eliminar">Eliminar</button>
                    </div>
                `;
                listaCarrito.appendChild(item);

                // Convertir el precio a número y sumar al total
                const precio = parseFloat(producto.precio.replace('S/', '').trim());
                total += precio;
            });

            // Mostrar el total en el elemento totalCarrito
            totalCarrito.textContent = `Total: S/ ${total.toFixed(2)}`;
        }
    }

    // Función para eliminar un producto del carrito y actualizar el total
    function eliminarDelCarrito(index) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        carrito.splice(index, 1); // Elimina el producto en la posición "index"
        localStorage.setItem('carrito', JSON.stringify(carrito)); // Actualiza el localStorage
        cargarCarrito(); // Recarga la lista del carrito para reflejar los cambios
    }

    // Cargar el carrito al abrir la página
    cargarCarrito();
</script>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
